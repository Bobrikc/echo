plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0'
group = 'com.echocity.velmar'
base { archivesName = 'echocity' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { echocity { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
}

tasks.named('jar') {
    manifest { attributes 'Implementation-Title': 'echocity', 'Implementation-Version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
